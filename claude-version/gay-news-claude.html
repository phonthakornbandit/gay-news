

<title>GAY News</title>

<style>
:root{

  --ink:#15171C; --ink2:#3F4450; --muted:#5B6170; --faint:#6B7280;
  --accent:#1747C9; --accent-soft:#E8EDFB; --on-accent:#FFFFFF;
  --hero:#15171C; --hero-ink:#FFFFFF; --hero-sub:#B9C6F0;
  --warn-bg:#FFF7E6; --warn-ink:#8A5300; --hot-bg:#FFF0EB; --hot-ink:#B93815;
  --overlay:rgba(21,23,28,.45); --fs:16px;
}

:root[data-theme="dark"],:root[data-gn="dark"]{color-scheme:dark;
  --bg:#0F1115; --surface:#161920; --soft:#1C2029; --soft2:#232833; --line:#2C323E; --line2:#242A34;
  --ink:#ECEEF2; --ink2:#C5CAD3; --muted:#A3AAB6; --faint:#959DAA;
  --accent:#7FA2FF; --accent-soft:#1E2A4A; --on-accent:#0F1115;
  --hero:#1E2A4A; --hero-ink:#FFFFFF; --hero-sub:#B9C6F0;
  --warn-bg:#2E2412; --warn-ink:#F2C97A; --hot-bg:#3A1F17; --hot-ink:#FFB59E;
  --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:var(--fs);-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header.top{height:60px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;border-bottom:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:1;background:none;border:none;padding:0;text-align:left}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.brand b{font-size:19px;letter-spacing:-.3px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:12px;color:var(--ink)}
.icon-btn:active{background:var(--soft2)}
main.view{flex:1;min-height:0;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
main.view>*{flex-shrink:0}
nav.tabs{height:64px;flex-shrink:0;border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:12px}
nav.tabs button.on{color:var(--ink);font-weight:600}
h1{margin:0;font-size:26px;line-height:1.3}
h2{margin:0;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.dash{border-style:dashed;color:var(--muted)}
.chip .x{opacity:.6;font-size:16px;line-height:1}
.seg{display:grid;gap:4px;background:var(--soft2);border-radius:12px;padding:4px}
.seg button{height:36px;border:none;border-radius:9px;background:transparent;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{height:52px;border-radius:14px;border:none;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.small{height:40px;font-size:14px;border-radius:10px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.hero{border-radius:16px;background:var(--hero);color:var(--hero-ink);padding:16px;display:flex;flex-direction:column;gap:6px}
.hero small{font-size:12px;font-weight:600;color:var(--hero-sub)}
.hero p{margin:0;line-height:1.6;font-size:15px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--soft2);color:var(--ink2)}
.tag.a{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.hot{background:var(--hot-bg);color:var(--hot-ink);font-weight:600}
.card h3{margin:0;font-size:16px;line-height:1.45}
.card ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--ink2)}
.card .foot{display:flex;align-items:center;justify-content:space-between;padding-top:4px;border-top:1px solid var(--line2)}
.card .acts{display:flex}
.card .acts button,.card .acts a{width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:10px}
.card .acts .on{color:var(--accent)}
input.field,textarea.field,select.field{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px;font-size:16px}
textarea.field{min-height:140px;line-height:1.55;resize:vertical}
input.field:focus,textarea.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.end{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;padding:6px 0}
.end:before,.end:after{content:"";flex:1;height:1px;background:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.w{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.w b{font-size:11px;color:var(--accent);letter-spacing:.3px}
.w span{font-size:13px;line-height:1.45}
.tl{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:14px}
.tl .dot{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--accent);background:var(--bg);margin-top:5px}
.tl .ln{flex:1;width:2px;background:var(--accent-soft)}
.tl .body{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;flex:1;font-size:14px;line-height:1.5}
.tl .when{font-size:12px;font-weight:600;color:var(--accent)}
.box{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
.box.soft{background:var(--soft)}
.box.warn{background:var(--warn-bg)}
.box.warn b{color:var(--warn-ink)}
p.txt{margin:0;font-size:14px;line-height:1.75;color:var(--ink2);white-space:pre-line}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:14px;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--muted);font-size:14px;text-align:center}
.err{background:var(--hot-bg);color:var(--hot-ink);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.drawer-wrap{position:absolute;inset:0;background:var(--overlay);display:none;justify-content:flex-end;z-index:20}
.drawer-wrap.open{display:flex}
.drawer{width:min(320px,86%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.15);overflow-y:auto}
.drawer .hd{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;border-bottom:1px solid var(--line2);flex-shrink:0}
.mi{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 12px;border:none;background:none;border-radius:12px;text-align:left;width:100%}
.mi:active{background:var(--soft2)}
.mi .ic{width:36px;height:36px;border-radius:10px;background:var(--soft2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi .t{display:flex;flex-direction:column}
.mi .t span:first-child{font-size:15px;font-weight:500}
.mi .t span:last-child{font-size:12px;color:var(--muted)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.sheet-wrap{position:absolute;inset:0;background:var(--overlay);display:none;align-items:flex-end;z-index:30}
.sheet-wrap.open{display:flex}
.sheet{width:100%;max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 20px;border-bottom:1px solid var(--line2)}
.sheet .bd{padding:16px 20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px}
.home{justify-content:flex-start}
.home .grow{flex:1}
.ask{flex-shrink:0;display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line2);background:var(--bg)}
.ask input{flex:1;height:44px;min-height:44px}
.sq{width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--soft2)}
.yt img{width:100%;height:100%;object-fit:cover;display:block}
.mom{display:flex;gap:10px;font-size:14px;color:var(--ink);line-height:1.5}
.mom b{color:var(--accent);min-width:48px}
.sec{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.sec p{margin:0;font-size:14px;line-height:1.65}
textarea.paste{min-height:120px}
.hint{font-size:12px;color:var(--faint);line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:600px){.app{border-left:1px solid var(--line2);border-right:1px solid var(--line2)}}
</style>

const MEM = {};
const caps = (async () => {

function h32(s){ let x = 5381; for (const c of String(s)) x = ((x << 5) + x + c.codePointAt(0)) >>> 0; return x.toString(36); }
const P = (k) => `gn/${S.user}/${k}`;
async function dget(path, fb){
  await caps;
  if (DB){ try { const s = await DB.doc(path).get(); if (s.exists){ const d = s.data(); return d && "v" in d ? d.v : fb; } return fb; } catch(e){ return MEM[path] ?? fb; } }
  return MEM[path] ?? fb;
}
async function dset(path, v){
  MEM[path] = v; await caps;
  if (DB){ try { await DB.doc(path).set({ v }); } catch(e){ console.warn("db write failed", e); } }
}
async function ddel(path){ delete MEM[path]; await caps; if (DB){ try { await DB.doc(path).delete(); } catch(e){} } }
const clip = (s, n) => String(s ?? "").replace(/[\u0000-\u0008\u000b-\u001f]/g, " ").trim().slice(0, n);
function fitBytes(s, max){
  const enc = new TextEncoder(); s = String(s || "");
  if (enc.encode(s).length <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi){ const m = (lo + hi + 1) >> 1; if (enc.encode(s.slice(0, m)).length <= max) lo = m; else hi = m - 1; }
  return s.slice(0, lo) + "\n…(ตัดส่วนที่เกินออก)";
}
function langLine(p){ return p.sumLang === "en" ? "Write every text value in English." : "เขียนข้อความทั้งหมดเป็นภาษาไทย"; }

async function ai(prompt, tier){
  await caps;
  if (!SAMPLE) throw new Error(L().noAI);
  try { return await SAMPLE.json(fitBytes(prompt, 60000), { modelTier: tier || "default" }); }
  catch(e){
    const c = e && e.code;
    if (c === "not_granted") throw new Error("ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude กดลองใหม่แล้วกดอนุญาต");
    if (c === "rate_limited") throw new Error("ใช้ Claude ถี่เกินไป รอสักครู่แล้วลองใหม่");
    if (c === "prompt_too_large") throw new Error("ข้อความยาวเกินไป ลองวางทีละส่วน");
    if (c === "invalid_json") throw new Error("Claude ตอบกลับไม่ครบ กดลองใหม่อีกครั้ง หรือวางข้อความให้สั้นลง");
    throw new Error((e && e.message) || "เรียก Claude ไม่สำเร็จ");
  }
}

async function savePrefs(patch){
  Object.assign(S.prefs, patch); applyPrefs(); render();
  try { const d = await api("/prefs/save", { prefs: S.prefs }); if (d.prefs) { S.prefs = d.prefs; applyPrefs(); } } catch(e){ toast(e.message); }
}
function applyPrefs(){
  const p = S.prefs || {}, root = document.documentElement;
  const dark = p.theme === "dark" || (p.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (p.theme === "auto") delete root.dataset.gn; else root.dataset.gn = dark ? "dark" : "light";
  root.lang = p.uiLang === "en" ? "en" : "th";
  root.style.setProperty("--fs", ({s:"15px",m:"16px",l:"18px"})[p.fontSize] || "16px");
}

/* =================== หน้าจอ =================== */
function render(){
  const top = $("topbar"), tabs = $("tabs"), view = $("view");
  $("askBar").innerHTML = "";
  if (!S.ready){ top.hidden = false; tabs.hidden = true; view.innerHTML = S.err ? errBox() + `<button class="btn ghost" id="bootRetry">${esc(L().retry)}</button>` : loading(""); return; }
  top.hidden = false; tabs.hidden = false;
  tabs.innerHTML = [["news","tabNews"],["follow","tabFollow"],["video","tabVideo"]].map(([k,l]) =>
    `<button class="${S.tab===k?"on":""}" data-tab="${k}" aria-current="${S.tab===k}">${svg(k==="news"?"news":k,22)}${L()[l]}</button>`).join("");
  if (S.tab === "news") view.innerHTML = S.screen === "feed" ? feedView() : homeView();
  else if (S.tab === "follow") view.innerHTML = S.storyQ ? storyView() : followView();
  else view.innerHTML = videoView();
  if (S.tab === "follow" && S.storyQ && S.story) $("askBar").innerHTML =
    `<form class="ask" id="askForm"><label class="sr" for="askIn">${esc(L().askAI)}</label><input id="askIn" class="field" placeholder="${esc(L().askAI)}" autocomplete="off"><button class="sq" aria-label="send">${svg("send",18,2.2)}</button></form>`;
  view.classList.remove("home");
}

function loading(text){ return `<div class="loading"><div class="spin"></div><div style="white-space:pre-line">${esc(text)}</div></div>`; }
function errBox(){ return S.err ? `<div class="err">${esc(S.err)}</div>` : ""; }

async function doLogin(){
  const d = await api("/login");
  S.prefs = d.prefs; S.ready = true; applyPrefs();
  api("/follow/list").then(x => { S.follows = x.follows; }).catch(()=>{});
  api("/saved/list").then(x => { S.saved = x.saved; }).catch(()=>{});
  api("/feed/last").then(x => { if (x && x.items){ S.lastFeed = x; render(); } }).catch(()=>{});
}

function homeView(){
  const t = L(), p = S.prefs, h = new Date().getHours();

  const all = [...BASE_TOPICS, ...p.customTopics];
  const chips = all.map(x => {
    const on = p.topics.includes(x), custom = p.customTopics.includes(x);
    return `<button class="chip ${on?"on":""}" data-topic="${esc(x)}" aria-pressed="${on}">${esc(x)}${custom?` <span class="x" data-del="${esc(x)}" aria-label="ลบ">×</span>`:""}</button>`;
  }).join("");
  const seg = (key, opts) => `<div class="seg" style="grid-template-columns:repeat(${opts.length},minmax(0,1fr))">${opts.map(([v,l]) =>
    `<button class="${p[key]===v?"on":""}" data-pref="${key}" data-val="${v}">${esc(t[l])}</button>`).join("")}</div>`;

  return `
  <div><div class="muted" style="font-size:14px">${esc(hello)}${p.name?" "+esc(p.name):""}</div><h1>${esc(t.ask)}</h1></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="between"><span class="label">${esc(t.topics)}</span>${S.lastFeed?`<button class="chip" style="height:32px;border:none;color:var(--accent);padding:0" id="sameBtn">${esc(t.lastFeed)}</button>`:""}</div>
    <div class="chips">${chips}<button class="chip dash" id="addTopic">${esc(t.add)}</button></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="label">${esc(t.len)}</span>${seg("length",[["short","short"],["mid","mid"],["long","long"]])}</div>
  <div style="display:flex;flex-direction:column;gap:6px"><label class="label" for="newsText">${esc(t.pasteNews)}</label>
    <textarea id="newsText" class="field paste" placeholder="${esc(t.pasteNewsPh)}">${esc(S.newsText||"")}</textarea>
    <span class="hint">${esc(t.pasteHint)}</span></div>
  <button class="btn" id="goBtn" ${p.topics.length?"":"disabled"}>${esc(t.go(p.topics.length))}</button>`;
}

function feedView(){
  const t = L(), f = S.feed;
  const head = `<div class="row" style="margin:-6px 0 -4px -8px">
    <button class="icon-btn" id="backHome" aria-label="back">${svg("back",22)}</button>
    <div style="flex:1;display:flex;flex-direction:column"><b style="font-size:17px">${esc(t.yourNews)}</b>
    <span class="muted" style="font-size:12px">${f&&f.items?`${f.items.length} · ${esc(t.aiBy)}`:""}</span></div></div>`;
  if (S.busy || !f) return head + loading(t.loadingNews);
  if (f.error) return head + `<div class="err">${esc(f.error)}</div><button class="btn ghost" id="feedRetry">${esc(t.retry)}</button>`;
  const cats = [...new Set(f.items.map(i => i.topic))];
  const shown = f.items.filter(i => S.filter === "all" || i.topic === S.filter);
  const savedSet = new Set(S.saved.map(s => s.link));
  return head + `
  <div class="chips scroll">
    <button class="chip ${S.filter==="all"?"on":""}" data-filter="all">${esc(t.all)} ${f.items.length}</button>
    ${cats.map(c => `<button class="chip ${S.filter===c?"on":""}" data-filter="${esc(c)}">${esc(c)}</button>`).join("")}
  </div>
  ${f.overview?`<section class="hero"><small>${esc(t.overview)}</small><p>${esc(f.overview)}</p></section>`:""}
  ${shown.map(n => `<article class="card">
    <div class="row" style="font-size:12px;gap:6px;flex-wrap:wrap"><span class="tag a">${esc(n.category)}</span><span class="tag">${esc(n.tone)}</span>${n.source||n.date?`<span style="color:var(--faint)">· ${esc(n.source)}${n.date?" · "+esc(n.date):""}</span>`:""}</div>
    <h3>${esc(n.headline)}</h3>
    ${n.points.length?`<ul>${n.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
    <div class="foot"><span class="muted" style="font-size:12px">${esc(n.topic)}</span>
      <div class="acts">
        <button data-follow="${n.id}" aria-label="${esc(t.tabFollow)}">${svg("plus",19)}</button>
        <button data-save="${n.id}" class="${savedSet.has(n.link)?"on":""}" aria-label="${esc(t.saved)}">${svg("bookmark",19)}</button>
        ${n.link?`<a href="${safeUrl(n.link)}" target="_blank" rel="noopener" aria-label="open">${svg("share",19)}</a>`:""}
      </div></div>
  </article>`).join("")}

async function loadFeed(refresh){
  const p = S.prefs;
  S.screen = "feed"; S.feed = null; S.filter = "all"; S.busy = true; render();
  try { S.feed = await api("/news", { topics: p.topics, length: p.length, text: S.newsText }); S.lastFeed = S.feed; }
  catch(e){ S.feed = { error: e.message }; }
  S.busy = false; render(); $("view").scrollTop = 0;
}
async function openStory(q, refresh, add){
  S.storyQ = q; S.story = null; render(); $("view").scrollTop = 0;
  try { S.story = await api("/story", { q, refresh: !!refresh, add }); } catch(e){ S.story = { error: e.message }; }
  if (S.storyQ === q) render();
}
async function runVideo(url, mode){
  S.vUrl = url; S.vTitle = ($("vTitle")||{}).value || S.vTitle || ""; S.vMode = mode; S.busy = true; S.err = null; S.vResult = null; render();
  try { S.vResult = await api("/video", { text: url, title: S.vTitle, mode }); api("/video/history").then(d => { S.vHistory = d.history; render(); }); }
  catch(e){ S.err = e.message; }
  S.busy = false; render();
}

document.addEventListener("click", async e => {
  const el = e.target.closest("button,a"); if (!el) return;
  const d = el.dataset;
  if (d.tab){ S.tab = d.tab; S.err = null; if (d.tab==="video" && !S.vHistory.length) api("/video/history").then(x=>{S.vHistory=x.history;render();}).catch(()=>{}); render(); $("view").scrollTop=0; return; }
  if (e.target.dataset.del){ e.stopPropagation(); const x = e.target.dataset.del;
    savePrefs({ customTopics: S.prefs.customTopics.filter(c=>c!==x), topics: S.prefs.topics.filter(c=>c!==x) }); return; }
  if (d.topic){ const x = d.topic, on = S.prefs.topics.includes(x);
    savePrefs({ topics: on ? S.prefs.topics.filter(c=>c!==x) : [...S.prefs.topics, x] }); return; }
  if (d.pref){ savePrefs({ [d.pref]: d.val }); return; }
  if (d.filter){ S.filter = d.filter; render(); return; }
  if (d.vmode){ S.vMode = d.vmode; S.vUrl = ($("yt")||{}).value || S.vUrl; S.vTitle = ($("vTitle")||{}).value || S.vTitle; render(); return; }
  if (d.story){ openStory(d.story); return; }
  if (d.vh){ const it = S.vHistory.find(x => x.id === d.vh); if (it){ S.vResult = it; S.err = null; render(); $("view").scrollTop = 0; } return; }
  if (d.save){ const n = S.feed.items[Number(d.save)];
    try { S.saved = (await api("/saved/toggle", { item: n })).saved; render(); toast(L().saved1); } catch(err){ toast(err.message); } return; }
  if (d.follow){ const n = S.feed.items[Number(d.follow)]; promptFollow(n.headline.slice(0,40), [n.headline, ...n.points, n.source, n.link, n.date].filter(Boolean).join("\n")); return; }
  if (d.menu){ closeDrawer(); openSheet(d.menu); return; }
  if (d.theme){ savePrefs({ theme: d.theme }); return; }
  if (d.uil){ savePrefs({ uiLang: d.uil }); return; }
  if (d.suml){ savePrefs({ sumLang: d.suml }); return; }
  if (d.fs){ savePrefs({ fontSize: d.fs }); return; }
  if (d.nc){ savePrefs({ newsCount: Number(d.nc) }); return; }
  if (d.preset){ const ta = $("promptTa"); if (ta) ta.value = d.preset; return; }
  if (d.ptab){ S.ptab = d.ptab; openSheet("prompt"); return; }

  switch (el.id){
    case "brand": S.tab = "news"; S.screen = "home"; render(); break;
    case "menuBtn": openDrawer(); break;
    case "goBtn": case "feedRetry": { const ta = $("newsText"); if (ta) S.newsText = ta.value; if (!String(S.newsText||"").trim()){ toast(L().pasteNewsPh); break; } loadFeed(false); break; }
    case "sameBtn": S.feed = S.lastFeed; S.filter = "all"; S.screen = "feed"; render(); break;
    case "backHome": S.screen = "home"; render(); break;
    case "recBtn": S.recOpen = true; render();
      if (!S.rec || S.rec.error){ S.rec = null; render(); try { S.rec = await api("/recommend"); } catch(err){ S.rec = { error: err.message }; } render(); } break;
    case "recClose": S.recOpen = false; render(); break;
    case "addTopic": askText(L().newTopic, v => { if (!S.prefs.customTopics.includes(v)) savePrefs({ customTopics: [...S.prefs.customTopics, v], topics: [...S.prefs.topics, v] }); }); break;
    case "addFollow": promptFollow(""); break;
    case "backFollow": S.storyQ = null; S.story = null; render(); break;
    case "storyRefresh": openStory(S.storyQ, true); break;
    case "storyRetry": openStory(S.storyQ); break;
    case "storyAdd": { const v = ($("storyText")||{}).value || ""; if (v.trim()) openStory(S.storyQ, false, v.trim()); break; }
    case "unfollowBtn": try { S.follows = (await api("/follow/remove", { q: S.storyQ })).follows; } catch(err){ toast(err.message); }
      S.storyQ = null; S.story = null; render(); break;
    case "vGo": case "vGo2": { const u = $("yt").value.trim(); if (u) runVideo(u, S.vMode); break; }
    case "vCopy": { const v = S.vResult; const txt = v.mode === "full"
        ? v.sections.map(s => `[${s.start}] ${s.title}\n` + s.lines.map(l => `${l.speaker}: ${l.text}`).join("\n")).join("\n\n")
        : `${v.headline}\n\n` + (v.summary||[]).map(s=>"• "+s).join("\n") + "\n\n" + (v.key_moments||[]).map(k=>`${k.time} ${k.point}`).join("\n");
      try { await navigator.clipboard.writeText(txt); toast(L().copied); } catch(err){ toast("copy failed"); } break; }
    case "switchUser": S.user = S.user === "jo" ? "u2" : "jo"; lsSet("gn_user", S.user); closeDrawer();
      Object.assign(S, { ready: false, feed: null, lastFeed: null, newsText: "", rec: null, recOpen: false, vResult: null, vHistory: [], follows: [], saved: [], storyQ: null, story: null, screen: "home", tab: "news", err: null });
      boot(); break;
    case "bootRetry": boot(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "newsText") S.newsText = e.target.value;
  if (e.target.id === "yt") S.vUrl = e.target.value;
  if (e.target.id === "vTitle") S.vTitle = e.target.value;
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "askForm") return;
  e.preventDefault();
  const inp = $("askIn"), q = inp.value.trim(); if (!q) return;
  inp.value = ""; const box = $("answer");
  box.innerHTML = `<div class="box soft"><b>${esc(q)}</b>${loading("")}</div>`;
  box.scrollIntoView({ behavior: "smooth", block: "center" });
  try { const a = await api("/story/ask", { q: S.storyQ, question: q });
    box.innerHTML = `<div class="box soft"><b>${esc(q)}</b><p class="txt" style="margin-top:6px">${esc(a.answer)}</p></div>`; }
  catch(err){ box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
});

function promptFollow(def, seed){
  askText(L().newFollow, async v => {
    try { S.follows = (await api("/follow/add", { q: v, seed })).follows; toast(L().followed); S.tab = "follow"; openStory(v); }
    catch(err){ toast(err.message); }
  }, def);
}

/* =================== เมนู + แผ่นตั้งค่า =================== */
function openDrawer(){
  const t = L(), p = S.prefs;
  const item = (k, ic, title, sub) => `<button class="mi" data-menu="${k}"><span class="ic">${svg(ic,18)}</span><span class="t"><span>${esc(title)}</span><span>${esc(sub)}</span></span></button>`;
  $("drawer").innerHTML = `
    <div class="hd"><b style="font-size:17px">${esc(t.menu)}</b><button class="icon-btn" id="drawerClose" aria-label="close">${svg("close",22)}</button></div>
    <div class="row" style="padding:18px 20px;border-bottom:1px solid var(--line2);gap:12px">
      <span class="avatar">${esc((p.name||"?").slice(0,1).toUpperCase())}</span>
      <div style="display:flex;flex-direction:column;flex:1"><b>${esc(p.name||"—")}</b><span class="muted" style="font-size:12px">${S.user==="jo"?t.p1:t.p2}</span></div>
      <button class="chip" id="switchUser" style="height:34px">${esc(t.switchTo)} ${S.user==="jo"?"2":"1"}</button></div>
    <nav style="display:flex;flex-direction:column;padding:8px">
      ${item("profile","user",t.profile,t.profileS)}
      ${item("prompt","prompt",t.prompt,t.promptS)}
      ${item("theme","sun",t.theme,t[p.theme])}
      ${item("lang","globe",t.lang,`${p.uiLang==="en"?"English":"ไทย"} · ${p.sumLang==="en"?"English":"ไทย"}`)}
      ${item("saved","bookmark",t.saved,String(S.saved.length))}
      ${item("settings","gear",t.settings,t.settingsS)}
    </nav>`;
  $("drawerWrap").classList.add("open");
  $("drawerClose").onclick = closeDrawer;
}
function closeDrawer(){ $("drawerWrap").classList.remove("open"); }
$("drawerWrap").addEventListener("click", e => { if (e.target.id === "drawerWrap") closeDrawer(); });

function sheetShell(title, body){
  $("sheet").innerHTML = `<div class="hd"><b>${esc(title)}</b><button class="icon-btn" id="sheetClose" aria-label="close">${svg("close",22)}</button></div><div class="bd">${body}</div>`;
  $("sheetWrap").classList.add("open");
  $("sheetClose").onclick = closeSheet;
}
function closeSheet(){ $("sheetWrap").classList.remove("open"); render(); }
$("sheetWrap").addEventListener("click", e => { if (e.target.id === "sheetWrap") closeSheet(); });

function segRow(attr, cur, opts){
  return `<div class="seg" style="grid-template-columns:repeat(${opts.length},minmax(0,1fr))">${opts.map(([v,l]) =>
    `<button class="${String(cur)===String(v)?"on":""}" data-${attr}="${v}">${esc(l)}</button>`).join("")}</div>`;
}
function openSheet(kind){
  const t = L(), p = S.prefs;
  if (kind === "profile"){
    sheetShell(t.profile, `<label class="label" for="nm">${esc(t.name)}</label><input id="nm" class="field" value="${esc(p.name)}" maxlength="40">
      <button class="btn" id="saveProfile">${esc(t.save)}</button>`);
    $("saveProfile").onclick = () => { savePrefs({ name: $("nm").value.trim() }); closeSheet(); toast(t.saved1); };
  }
  if (kind === "theme"){
    sheetShell(t.theme, segRow("theme", p.theme, [["light",t.light],["dark",t.dark],["auto",t.auto]]));
  }
  if (kind === "lang"){
    sheetShell(t.lang, `<span class="label">${esc(t.uiLang)}</span>${segRow("uil", p.uiLang, [["th","ไทย"],["en","English"]])}
      <span class="label">${esc(t.sumLang)}</span>${segRow("suml", p.sumLang, [["th","ไทย"],["en","English"]])}`);
  }
  if (kind === "settings"){
    sheetShell(t.settings, `<span class="label">${esc(t.font)}</span>${segRow("fs", p.fontSize, [["s","A"],["m","A+"],["l","A++"]])}
      <span class="label">${esc(t.count)}</span>${segRow("nc", p.newsCount, [[10,"10"],[20,"20"],[30,"30"]])}`);
  }
  if (kind === "saved"){
    sheetShell(t.saved, S.saved.length ? S.saved.map(s => `<a class="listrow" href="${safeUrl(s.link)}" target="_blank" rel="noopener" style="color:var(--ink)"><span>${esc(s.headline)}<br><span class="muted" style="font-size:12px">${esc(s.source)} · ${esc(ago(s.saved))}</span></span><span class="muted">↗</span></a>`).join("")
      : `<div class="loading">${esc(t.noSaved)}</div>`);
  }
  if (kind === "prompt"){
    const k = S.ptab || "news";
    const names = { news: t.pNews, story: t.pStory, video: t.pVideo };
    sheetShell(t.prompt, `<div class="chips scroll">${Object.keys(names).map(x => `<button class="chip ${x===k?"on":""}" data-ptab="${x}">${esc(names[x])}</button>`).join("")}</div>
      <p class="muted" style="margin:0;line-height:1.6">${esc(t.promptHelp)}</p>
      <label class="sr" for="promptTa">${esc(names[k])}</label>
      <textarea id="promptTa" class="field" maxlength="1500">${esc(p.styles[k]||"")}</textarea>
      <div class="chips">${t.presets.map(x => `<button class="chip" data-preset="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div class="row"><button class="btn ghost small" id="resetPrompt">${esc(t.reset)}</button><button class="btn small" id="savePrompt">${esc(t.save)}</button></div>`);
    $("savePrompt").onclick = () => { savePrefs({ styles: { ...p.styles, [k]: $("promptTa").value.trim() } }); toast(t.saved1); };
    $("resetPrompt").onclick = () => { $("promptTa").value = ""; savePrefs({ styles: { ...p.styles, [k]: "" } }); toast(t.saved1); };
  }
}
function askText(label, cb, def){
  const t = L();
  sheetShell(label, `<label class="sr" for="askT">${esc(label)}</label><input id="askT" class="field" maxlength="60" value="${esc(def||"")}" placeholder="${esc(label)}">
    <div class="row"><button class="btn ghost small" id="askNo">${esc(t.cancel)}</button><button class="btn small" id="askOk">${esc(t.ok)}</button></div>`);
  const inp = $("askT"); setTimeout(() => inp.focus(), 50);
  const ok = () => { const v = inp.value.trim(); if (!v) return; $("sheetWrap").classList.remove("open"); cb(v); render(); };
  $("askOk").onclick = ok; $("askNo").onclick = closeSheet;
  inp.onkeydown = e => { if (e.key === "Enter") ok(); };
}

/* =================== เริ่มต้น =================== */
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyPrefs);
async function boot(){
  S.ready = false; S.err = null; render();
  try { await doLogin(); } catch(e){ S.err = e.message; }
  render();
}
boot();
</script>
