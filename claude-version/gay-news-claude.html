
<title>GAY News</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+Thai:wght@500;600;700;800&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* หน้าหนังสือพิมพ์: กระดาษนวล หมึกดำ สีเลือดหมูสำหรับป้ายหมวดและข่าวด่วน */
:root{
  --paper:#F3EEE3; --paper2:#EAE3D3; --card:#F8F4EB; --ink:#1B1A17; --ink2:#3B3832; --muted:#5F594E; --faint:#6F685C;
  --rule:#CFC5B1; --rule-strong:#1B1A17; --bar:#1C1B18; --bar-ink:#F3EEE3; --accent:#8B1E1E; --accent-ink:#FFFFFF;
  --warn:#F6E7C8; --warn-ink:#6E4A07; --overlay:rgba(27,26,23,.5);
  --serif:'Noto Serif Thai','Playfair Display',Georgia,serif; --mast:'Playfair Display','Noto Serif Thai',Georgia,serif;
  --sans:'Sarabun',system-ui,sans-serif; --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-gn="light"]){
    --paper:#15140F; --paper2:#1F1D17; --card:#1A1813; --ink:#ECE5D6; --ink2:#D2CAB8; --muted:#A59D8B; --faint:#9A927F;
    --rule:#3A362D; --rule-strong:#ECE5D6; --bar:#0D0C09; --bar-ink:#ECE5D6; --accent:#E3907F; --accent-ink:#15140F;
    --warn:#33280F; --warn-ink:#F0CF8A; --overlay:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-gn="dark"]{
  --paper:#15140F; --paper2:#1F1D17; --card:#1A1813; --ink:#ECE5D6; --ink2:#D2CAB8; --muted:#A59D8B; --faint:#9A927F;
  --rule:#3A362D; --rule-strong:#ECE5D6; --bar:#0D0C09; --bar-ink:#ECE5D6; --accent:#E3907F; --accent-ink:#15140F;
  --warn:#33280F; --warn-ink:#F0CF8A; --overlay:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{flex-shrink:0}

/* แถบบน */
.topbar{position:sticky;top:0;z-index:15;background:var(--bar);color:var(--bar-ink)}
.topbar .wrap{display:flex;align-items:center;height:56px;gap:4px}
.tb-btn{height:56px;min-width:44px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--bar-ink);padding:0 10px;font-weight:600;font-size:15px}
.tb-btn:hover{background:rgba(255,255,255,.08)}
.tb-mark{font-family:var(--mast);font-weight:900;font-size:21px;letter-spacing:.02em;padding:0 12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.scrolled .tb-mark,.no-mast .tb-mark{opacity:1;pointer-events:auto}
.tb-sp{flex:1}
.tb-ed{border-left:1px solid rgba(255,255,255,.15)}
.searchrow{background:var(--bar);border-top:1px solid rgba(255,255,255,.12);display:none}
.searchrow.open{display:block}
.searchrow form{display:flex;gap:8px;padding:10px 0}
.searchrow input{flex:1;min-width:0;height:44px;border-radius:2px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--bar-ink);padding:0 14px;font-size:16px}
.searchrow button{height:44px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:2px}

/* หัวหนังสือพิมพ์ */
.masthead{text-align:center;padding:22px 0 10px}
.dateline{font-size:14px;color:var(--muted);letter-spacing:.02em}
.logo{display:inline-flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);color:var(--ink);margin:6px 0 2px}
.logo .w{font-family:var(--mast);font-weight:900;font-size:clamp(40px,8.5vw,86px);line-height:1;letter-spacing:.01em}
.crest{width:clamp(48px,9vw,92px);height:auto;color:var(--ink)}
.motto{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);letter-spacing:.08em}
.sections{border-top:1px solid var(--rule-strong);border-bottom:3px double var(--rule-strong);position:relative}
.sections .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.sections .wrap::-webkit-scrollbar{display:none}
.sec-btn{height:46px;padding:0 14px;font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-3px}
.sec-btn:hover{color:var(--ink)}
.sec-btn.on{color:var(--ink);border-bottom-color:var(--accent)}
.sec-btn.edit{color:var(--accent)}

/* ข่าวด่วนวิ่ง */
.ticker{border-bottom:1px solid var(--rule);overflow:hidden}
.ticker .wrap{display:flex;align-items:center;height:40px;gap:12px}
.tk-label{background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 9px;flex-shrink:0;text-transform:uppercase}
.tk-track{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tk-run{display:inline-flex;gap:36px;white-space:nowrap;animation:tick 60s linear infinite;padding-left:24px}
.tk-run:hover{animation-play-state:paused}
.tk-run button{font-size:14px;color:var(--ink2);font-weight:500}
.tk-run button:hover{color:var(--ink);text-decoration:underline}
.tk-run i{color:var(--accent);font-style:normal;margin-right:8px}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tk-run{animation:none}.tk-track{overflow-x:auto}}

main{padding-top:18px;padding-bottom:40px;min-height:50vh}

/* ส่วนประกอบข่าว */
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.hl{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meta .dot:before{content:"·";margin-right:10px;color:var(--rule)}
.img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--paper2);max-width:100%}
.story{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;color:var(--ink)}
.story:hover .hl{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.story p{margin:0;color:var(--ink2);font-size:15px;line-height:1.65}
.clamp2{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.front{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}
.lead .hl{font-size:clamp(26px,3.4vw,40px)}
.lead p{font-size:17px}
.lead .img{aspect-ratio:3/2}
.standfirst{font-family:var(--serif);font-size:17px;color:var(--ink2);line-height:1.7;margin:0}
.aside{border-left:1px solid var(--rule);padding-left:24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.box-h{font-family:var(--serif);font-weight:800;font-size:18px;border-top:3px solid var(--rule-strong);padding-top:8px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mostread{list-style:none;margin:0;padding:0;counter-reset:mr}
.mostread li{counter-increment:mr;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.mostread li:before{content:counter(mr);font-family:var(--mast);font-weight:900;font-size:30px;line-height:1;color:var(--accent);min-width:24px}
.mostread .hl{font-size:16px}
.rule{border:0;border-top:1px solid var(--rule);margin:26px 0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.row3 > *{min-width:0}
.row3 .hl{font-size:20px}
.secblock{margin-top:34px}
.sec-h{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.sec-h h2{font-family:var(--serif);font-weight:800;font-size:24px;margin:0;white-space:nowrap}
.sec-h:after{content:"";flex:1;border-top:1px solid var(--rule-strong)}
.sec-h button{order:3;font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px 28px;margin-top:34px}
.seccol{display:flex;flex-direction:column;gap:14px;min-width:0}
.seccol .sec-h{margin:0}
.seccol .sec-h h2{font-size:21px}
.seccol .story.small{border-top:1px solid var(--rule);padding-top:12px}
.seccol .story.small .hl{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 24px}
.grid > *{min-width:0}
.grid .hl{font-size:19px}
.overview{border-top:3px double var(--rule-strong);border-bottom:1px solid var(--rule);padding:12px 0;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.overview b{font-family:var(--serif);font-size:14px;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
.overview p{margin:0;font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:16px;line-height:1.7}
.end{text-align:center;color:var(--faint);margin:38px 0 6px;font-family:var(--serif);letter-spacing:.3em}
.edbox{background:var(--card);border:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:10px}
.edbox a,.edbox button.story{gap:3px}
.edbox .why{font-size:13px;color:var(--muted)}

/* บทความ */
.article{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.article .hl{font-size:clamp(28px,4vw,44px)}
.byline{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0}
.article .body p{font-size:18px;line-height:1.85;margin:0 0 14px;color:var(--ink)}
.article .body p:first-child:lang(en):first-letter,:root[lang="en"] .article .body p:first-child:first-letter{font-family:var(--mast);font-weight:900;float:left;font-size:58px;line-height:.9;padding:6px 8px 0 0;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:46px;padding:0 18px;border-radius:2px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-strong)}
.btn.red{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);min-height:40px}
.note{font-size:13px;color:var(--faint);font-style:italic}

/* ติดตาม / วิดีโอ */
.page-h{font-family:var(--serif);font-weight:800;font-size:clamp(28px,3.5vw,38px);margin:0;border-bottom:3px double var(--rule-strong);padding-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule-strong)}
.facts div{padding:10px 12px 12px 0;border-bottom:1px solid var(--rule);min-width:0}
.facts b{display:block;font-size:12px;letter-spacing:.08em;color:var(--accent)}
.tl{border-left:2px solid var(--rule-strong);margin-left:6px;padding-left:18px;display:flex;flex-direction:column;gap:16px}
.tl div{position:relative}
.tl div:before{content:"";position:absolute;left:-25px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.tl .when{font-weight:700;font-size:14px;color:var(--accent)}
.pullbox{background:var(--warn);color:var(--warn-ink);padding:14px 16px}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.listrow .hl{font-size:18px}
.srow{display:flex;gap:12px;align-items:flex-start}
.srow img{width:84px;height:56px;object-fit:cover;flex-shrink:0;background:var(--paper2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px}
.two > *{min-width:0}

/* ฟอร์ม */
.field{width:100%;min-height:48px;border:1px solid var(--rule);background:var(--card);padding:10px 14px;font-size:16px;border-radius:2px}
textarea.field{min-height:130px;line-height:1.6;resize:vertical}
.label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--rule-strong);font-size:14px;display:inline-flex;align-items:center;gap:6px;border-radius:2px}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.dash{border-style:dashed;color:var(--muted)}
.chip .x{opacity:.65}
.seg{display:grid;border:1px solid var(--rule-strong)}
.seg button{min-height:40px;font-size:14px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}

.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:56px 0;color:var(--muted);text-align:center;white-space:pre-line}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--rule);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--warn);color:var(--warn-ink);padding:12px 14px;font-size:15px}
.empty{padding:40px 0;text-align:center;color:var(--muted);white-space:pre-line}

/* เมนู ลิ้นชัก แผ่นตั้งค่า */
.overlay{position:fixed;inset:0;background:var(--overlay);display:none;z-index:30}
.overlay.open{display:flex}
.drawer{width:min(340px,88%);height:100%;background:var(--paper);overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer .hd,.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 20px;border-bottom:3px double var(--rule-strong)}
.drawer .hd b,.sheet .hd b{font-family:var(--serif);font-size:20px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mi{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 20px;width:100%;text-align:left;border-bottom:1px solid var(--rule)}
.mi:hover{background:var(--paper2)}
.mi small{display:block;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mast);font-weight:900;font-size:20px}
#sheetWrap{align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);max-height:92%;background:var(--paper);display:flex;flex-direction:column;border-top:3px solid var(--rule-strong)}
.sheet .bd{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){#sheetWrap{align-items:center}.sheet{max-height:86%;border:1px solid var(--rule-strong)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}

/* แถบล่างบนมือถือ */
.tabs{display:none}
footer{border-top:3px double var(--rule-strong);padding:18px 0 28px;color:var(--faint);font-size:13px;text-align:center}

@media (max-width:900px){
  .front,.two{grid-template-columns:minmax(0,1fr)}
  .aside{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:18px}
  .row3{grid-template-columns:minmax(0,1fr)}
  .row3 .story{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:4px 14px}
  .row3 .story .img{grid-column:2;grid-row:1/span 4;aspect-ratio:1/1}
  .row3 .story > :not(.img){grid-column:1}
}
@media (max-width:760px){
  :root{--fs:16px}
  .tb-btn .lbl{display:none}
  .masthead{padding:14px 0 6px}
  .motto{display:none}
  .sections .wrap{justify-content:flex-start}
  .sec-btn{height:42px;padding:0 10px;font-size:14px}
  .grid{grid-template-columns:minmax(0,1fr);gap:0}
  .grid .story{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .grid .story .img{grid-column:2;grid-row:1/span 4;aspect-ratio:1/1}
  .grid .story > :not(.img){grid-column:1}
  .grid .story p{display:none}
  .tb-btn{padding:0 8px;font-size:14px}
  .tb-mark{font-size:18px;padding:0 6px}
  .secgrid{grid-template-columns:minmax(0,1fr);gap:26px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:sticky;bottom:0;z-index:14;background:var(--paper);border-top:1px solid var(--rule-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--faint)}
  .tabs button.on{color:var(--ink);font-weight:700}
  .article .body p{font-size:17px}
  .overview{grid-template-columns:minmax(0,1fr);gap:4px}
}
.topbar{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bar)}
</style>

<div id="app">
  <header class="topbar" id="topbar">
    <div class="wrap">
      <button class="tb-btn" id="menuBtn" aria-label="เมนู"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="tb-btn" id="searchBtn" aria-label="ค้นหา"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="tb-mark" id="tbMark">GAY NEWS</button>
      <span class="tb-sp"></span>
      <button class="tb-btn tb-ed" id="edBtn"><span id="edLabel">ฉบับเช้า</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="tb-btn" id="whoBtn"><span class="lbl" id="whoLabel"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
    </div>
    <div class="searchrow" id="searchRow"><div class="wrap"><form id="searchForm" role="search"><label class="sr" for="q">ค้นข่าว</label><input id="q" placeholder="ค้นข่าว เช่น ประท้วง, ค่าแรง, AI" autocomplete="off"><button>ค้นหา</button></form></div></div>
  </header>

  <div id="mastWrap">
    <div class="masthead wrap">
      <div class="dateline" id="dateline"></div>
      <a class="logo" href="#" id="logo" aria-label="GAY News หน้าแรก">
        <span class="w">GAY</span>
        <svg class="crest" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="60" cy="60" r="56" stroke-width="2"/><circle cx="60" cy="60" r="51" stroke-width="1"/>
          <g stroke-width="1.6">

<script>
/* =================== หลังบ้านสำหรับ claude.ai: Claude + ที่เก็บข้อมูลของหน้า + Parallel Search =================== */
(() => {
const U = { user: "jo", prefs: null };

const DEFAULT_PREFS = { name:"", topics:["เศรษฐกิจ","ไอที"], customTopics:[], length:"mid", period:"1d", theme:"auto", uiLang:"th", sumLang:"th", newsCount:20, fontSize:"m", styles:{ news:"", recommend:"", story:"", video:"" } };
let DB = null, SAMPLE = null;
const MEM = {};
const caps = (async () => {
  try { DB = await window.claude?.use?.("db"); } catch(e){ DB = null; }
  try { SAMPLE = await window.claude?.use?.("sample"); } catch(e){ SAMPLE = null; }
})();
function h32(s){ let x = 5381; for (const c of String(s)) x = ((x << 5) + x + c.codePointAt(0)) >>> 0; return x.toString(36); }
const P = (k) => `gn/${U.user}/${k}`;
async function dget(path, fb){
  await caps;
  if (DB){ try { const s = await DB.doc(path).get(); if (s.exists){ const d = s.data(); return d && "v" in d ? d.v : fb; } return fb; } catch(e){ return MEM[path] ?? fb; } }
  return MEM[path] ?? fb;
}
async function dset(path, v){
  MEM[path] = v; await caps;
  if (DB){ try { await DB.doc(path).set({ v }); } catch(e){ console.warn("db write failed", e); } }
}
async function ddel(path){ delete MEM[path]; await caps; if (DB){ try { await DB.doc(path).delete(); } catch(e){} } }
const clip = (s, n) => String(s ?? "").replace(/[\u0000-\u0008\u000b-\u001f]/g, " ").trim().slice(0, n);
function fitBytes(s, max){
  const enc = new TextEncoder(); s = String(s || "");
  if (enc.encode(s).length <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi){ const m = (lo + hi + 1) >> 1; if (enc.encode(s.slice(0, m)).length <= max) lo = m; else hi = m - 1; }
  return s.slice(0, lo) + "\n…(ตัดส่วนที่เกินออก)";
}
function langLine(p){ return p.sumLang === "en" ? "Write every text value in English." : "เขียนข้อความทั้งหมดเป็นภาษาไทย"; }
function styleLine(p, k){ const s = clip(p.styles && p.styles[k], 1500); return s ? `\n\nสไตล์เพิ่มเติมที่ผู้ใช้กำหนด (ใช้กับน้ำเสียงและการเรียบเรียงเท่านั้น ห้ามเปลี่ยนรูปแบบ JSON):\n${s}` : ""; }
async function ai(prompt, tier){
  await caps;
  if (!SAMPLE) throw new Error("ต้องเปิดหน้านี้ใน claude.ai เพื่อใช้ Claude");
  try { return await SAMPLE.json(fitBytes(prompt, 60000), { modelTier: tier || "default" }); }
  catch(e){
    const c = e && e.code;
    if (c === "not_granted") throw new Error("ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude กดลองใหม่แล้วกดอนุญาต");
    if (c === "rate_limited") throw new Error("ใช้ Claude ถี่เกินไป รอสักครู่แล้วลองใหม่");
    if (c === "prompt_too_large") throw new Error("ข้อความยาวเกินไป ลองวางทีละส่วน");
    if (c === "invalid_json") throw new Error("Claude ตอบกลับไม่ครบ กดลองใหม่อีกครั้ง หรือวางข้อความให้สั้นลง");
    throw new Error((e && e.message) || "เรียก Claude ไม่สำเร็จ");
  }
}
let MCP = null;
const mcpP = (async () => { try { MCP = await window.claude?.use?.("mcp"); } catch(e){ MCP = null; } })();
const SEARCH_SERVER = "Parallel Search";
const SID = "gay-news-artifact-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function todayTh(){ const d = new Date(); return `${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`; }
function monthTh(){ const d = new Date(); return `${TH_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`; }
const PERIOD_TH = { "1d": "24 ชั่วโมงที่ผ่านมา", "3d": "3 วันที่ผ่านมา", "7d": "7 วันที่ผ่านมา" };
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch(e){ return ""; } }
async function webSearch(objective, queries){
  await mcpP;
  if (!MCP) throw new Error("หน้านี้ค้นเว็บไม่ได้ในตอนนี้ (ต้องเปิดใน claude.ai และเชื่อม Parallel Search ใน Settings › Connectors)");
  try {
    const r = await MCP.callTool(SEARCH_SERVER, "web_search", { objective, search_queries: queries.slice(0, 3), session_id: SID, model_name: "claude-artifact-gay-news" }, { cache: { staleTime: 300000 } });
    const pl = r && r.payload;
    const res = (pl && Array.isArray(pl.results)) ? pl.results : [];
    return res.map(x => ({ title: clip(x.title, 200), url: String(x.url || ""), date: clip(x.publish_date || "", 30), text: clip((x.excerpts || []).join(" "), 1500) }))
      .filter(x => /^https?:\/\//.test(x.url));
  } catch(e){
    const c = e && e.code;
    if (c === "server_not_connected" || c === "server_not_found") throw new Error("ยังไม่ได้เชื่อม Parallel Search: ไปที่ claude.ai › Settings › Connectors แล้วเพิ่ม Parallel Search");
    if (c === "not_in_manifest") throw new Error("ยังไม่ได้อนุญาตให้หน้านี้ใช้ Parallel Search เปิดหน้านี้ใหม่แล้วกดอนุญาต");
    if (c === "needs_reauth") throw new Error("Parallel Search ต้องเชื่อมใหม่: claude.ai › Settings › Connectors");
    if (c === "selection_required") throw new Error("มี Parallel Search มากกว่า 1 ตัว ให้เลือกตัวที่จะใช้ในหน้าต่างที่ขึ้นมา");
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") throw new Error("หน้านี้ค้นเว็บไม่ได้ในตอนนี้ (ต้องเปิดใน claude.ai และเชื่อม Parallel Search ใน Settings › Connectors)");
    if (c === "tool_error") throw new Error("Parallel Search ตอบกลับผิดพลาด: " + (e.message || ""));
    throw new Error("ค้นข่าวไม่สำเร็จชั่วคราว ลองใหม่อีกครั้ง");
  }
}
function freshEnough(x, period){
  const t = Date.parse(x.date); if (!x.date || !t) return true;
  const days = { "1d": 1.5, "3d": 3.5, "7d": 7.5 }[period] || 8;
  return Date.now() - t <= days * 86400e3;
}
// ---- อ่านฟีดข่าว (Bing News / Google News RSS) ผ่าน Parallel web_fetch ----
const FEED_PERIOD = { "1d": { bing: "7", g: "1d" }, "3d": { bing: "8", g: "3d" }, "7d": { bing: "8", g: "7d" } };
function parseFeedMarkdown(md, kind){
  const out = [];
  for (const block of String(md || "").split(/\n-{3,}\s*\n/)){
    const t = block.match(/^##\s+(.+)$/m), m = block.match(/Published:\s*([^\n·]+?)\s*·\s*Link:\s*(\S+)/);
    if (!t || !m) continue;
    let title = t[1].trim(), link = m[2].trim(), source = "";
    if (kind === "bing"){ try { const real = new URL(link).searchParams.get("url"); if (real) link = real; } catch(e){} source = hostOf(link); }
    else { const k = title.lastIndexOf(" - "); if (k > 0){ source = title.slice(k + 3).trim(); title = title.slice(0, k).trim(); } }
    if (!/^https?:\/\//.test(link)) continue;
    const text = block.slice(block.indexOf(m[0]) + m[0].length).replace(/&nbsp;/g, " ").replace(/-{3,}\s*$/, "").replace(/\s+/g, " ").trim();
    out.push({ title: clip(title, 220), url: link, date: m[1].trim(), source: clip(source, 60), text: clip(text, 600) });
  }
  return out;
}
async function fetchFeed(url, kind){
  await mcpP;
  if (!MCP) throw new Error("หน้านี้ดึงข่าวไม่ได้ในตอนนี้ (ต้องเปิดใน claude.ai และเชื่อม Parallel Search ใน Settings › Connectors)");
  try {
    const r = await MCP.callTool(SEARCH_SERVER, "web_fetch", { urls: [url], objective: "รายการหัวข่าวล่าสุด พร้อมลิงก์ วันที่ และชื่อสำนักข่าว", full_content: true, session_id: SID, model_name: "claude-artifact-gay-news" }, { cache: { staleTime: 300000 } });
    const pl = r && r.payload, res = pl && Array.isArray(pl.results) ? pl.results[0] : null;
    return parseFeedMarkdown(res && (res.full_content || (res.excerpts || []).join("\n---\n")), kind).slice(0, 25);
  } catch(e){ return mcpError(e); }
}
function mcpError(e){
  const c = e && e.code;
  if (c === "server_not_connected" || c === "server_not_found") throw new Error("ยังไม่ได้เชื่อม Parallel Search: ไปที่ claude.ai › Settings › Connectors แล้วเพิ่ม Parallel Search");
  if (c === "not_in_manifest") throw new Error("ยังไม่ได้อนุญาตให้หน้านี้ใช้ Parallel Search เปิดหน้านี้ใหม่แล้วกดอนุญาต");
  if (c === "needs_reauth") throw new Error("Parallel Search ต้องเชื่อมใหม่: claude.ai › Settings › Connectors");
  if (c === "selection_required") throw new Error("มี Parallel Search มากกว่า 1 ตัว ให้เลือกตัวที่จะใช้ในหน้าต่างที่ขึ้นมา");
  if (c === "tool_error") throw new Error("Parallel Search ตอบกลับผิดพลาด: " + (e.message || ""));
  throw new Error("ดึงข่าวไม่สำเร็จชั่วคราว ลองใหม่อีกครั้ง");
}
async function newsForTerm(t, period){
  const P2 = FEED_PERIOD[period] || FEED_PERIOD["1d"];
  const bing = `https://www.bing.com/news/search?q=${encodeURIComponent(t)}&format=rss&setmkt=th-TH&setlang=th-TH&qft=${encodeURIComponent(`interval="${P2.bing}"`)}`;
  const goog = `https://news.google.com/rss/search?q=${encodeURIComponent(`${t} when:${P2.g}`)}&hl=th&gl=TH&ceid=TH:th`;
  let items = [];
  try { items = await fetchFeed(bing, "bing"); } catch(e){ if (/เชื่อม|อนุญาต|ดึงข่าวไม่ได้/.test(e.message)) throw e; }
  if (items.length < 4){ try { items = items.concat(await fetchFeed(goog, "google")); } catch(e){ if (!items.length) throw e; } }
  if (!items.length){ // ทางสุดท้าย: ค้นเว็บทั่วไป
    items = (await webSearch(`ข่าวล่าสุดเกี่ยวกับ "${t}" (วันนี้คือ ${todayTh()})`, [`ข่าว ${t} ล่าสุด`, `${t} ${monthTh()}`])).map(x => ({ ...x, source: hostOf(x.url) }));
  }
  return items.map(x => ({ ...x, topic: t }));
}
async function searchNews(terms, period){
  let firstErr = null;
  const lists = await Promise.all(terms.slice(0, 6).map(t => newsForTerm(t, period).catch(e => { firstErr = firstErr || e; return []; })));
  const seen = new Set(), out = [];
  for (const list of lists) for (const x of list){
    const k = x.title.slice(0, 50);
    if (seen.has(x.url) || seen.has(k) || !freshEnough(x, period)) continue;
    seen.add(x.url); seen.add(k); out.push(x);
  }
  if (!out.length && firstErr) throw firstErr;
  return out;
}
function resultsToText(list){
  return list.map((x, i) => `[${i + 1}] ${x.title}\nหัวข้อที่ค้น: ${x.topic || "-"}\nURL: ${x.url}\nวันที่เผยแพร่: ${x.date || "ไม่ระบุ"}\nสำนัก: ${x.source || hostOf(x.url)}\n${x.text}`).join("\n\n");
}
const LENGTH_RULE = { short:"points มี 1 ข้อ สั้นมาก", mid:"points มี 2-3 ข้อ", long:"points มี 4-5 ข้อ แต่ละข้ออธิบายให้เข้าใจ" };

async function api(path, data = {}){

        const terms = text ? [text] : topics;
        if (!terms.length) throw new Error("เลือกหัวข้อ หรือพิมพ์คำค้นก่อน");

        const found = await searchNews(terms, period);
        if (!found.length) throw new Error("ไม่พบข่าวใหม่ในช่วงเวลานี้ ลองเลือกช่วงเวลาให้ยาวขึ้น หรือเปลี่ยนคำค้น");
        text = resultsToText(found.slice(0, 40));
        fromSearch = true;
      }
      const total = [10,20,30].includes(Number(p.newsCount)) ? Number(p.newsCount) : 20;
      const prompt = `คุณคือบรรณาธิการข่าวที่เป็นกลาง ผู้ใช้วางข้อความด้านล่าง ซึ่งอาจมีข่าวหลายชิ้น หัวข่าว ลิงก์ หรือโพสต์ปนกัน
งานของคุณ: แยกเป็นข่าวทีละเรื่อง (สูงสุด ${total} เรื่อง) รวมข่าวซ้ำเรื่องเดียวกันเป็นเรื่องเดียว แล้วสรุปแต่ละเรื่อง
ใช้เฉพาะข้อมูลในข้อความที่วาง ห้ามแต่งข้อเท็จจริง ตัวเลข ชื่อ หรือวันที่ที่ไม่มีในข้อความ${fromSearch ? `
ข้อความนี้เป็นรายการข่าวจากฟีดข่าว (กรองช่วงเวลาแล้ว) วันนี้คือ ${todayTh()} — ตัดเฉพาะรายการที่ไม่ใช่ข่าว (เช่น โพสต์โฆษณา หน้ารวมแท็ก) ห้ามตัดข่าวทิ้งทั้งหมด
link ให้ใช้ URL ของรายการนั้น source ให้ใช้ชื่อสำนักที่ระบุ date ให้ใช้วันที่เผยแพร่` : ""}
หัวข้อที่ผู้ใช้สนใจ: ${topics.join(", ") || "-"} — ใส่ topic เป็นหนึ่งในหัวข้อนี้ ถ้าไม่เข้ากับหัวข้อไหนให้ใส่ "อื่นๆ"
${langLine(p)}
ตอบเป็น JSON เท่านั้น:
{"overview":"ภาพรวมข่าวทั้งหมด 2-3 ประโยค",
 "items":[{"topic":"...","headline":"หัวข่าวเรียบเรียงใหม่ เป็นกลาง ไม่เรียกคลิก","points":["..."],"category":"หมวดสั้นๆ","tone":"บวก|กลาง|ลบ","source":"ชื่อสำนักถ้ามีในข้อความ ไม่มีให้เว้นว่าง","link":"URL ถ้ามีในข้อความ ไม่มีให้เว้นว่าง","date":"วันที่ถ้ามีในข้อความ"}]}
กติกา: ${LENGTH_RULE[data.length] || LENGTH_RULE.mid}${styleLine(p, "news")}

ข้อความที่ผู้ใช้วาง:
<<<
${fitBytes(text, 48000)}
>>>`;
      const r = await ai(prompt, "default");
      const items = (Array.isArray(r.items) ? r.items : []).slice(0, total).map((x, i) => ({
        id: i, topic: clip(x.topic || "อื่นๆ", 40), headline: clip(x.headline, 220),
        points: (Array.isArray(x.points) ? x.points : []).map(s => clip(s, 400)).slice(0, 6),
        category: clip(x.category || x.topic, 30), tone: ["บวก","กลาง","ลบ"].includes(x.tone) ? x.tone : "กลาง",
        source: clip(x.source || hostOf(x.link), 60), link: /^https?:\/\//.test(x.link || "") ? x.link : "", date: clip(x.date, 60), sources: 1,
      })).filter(x => x.headline);
      if (!items.length) throw new Error(fromSearch ? "ไม่พบข่าวใหม่ที่ตรงกับช่วงเวลานี้ ลองเลือกช่วงเวลาให้ยาวขึ้น" : "ไม่พบข่าวในข้อความที่วาง");
      const out = { overview: clip(r.overview, 800), items, created: new Date().toISOString() };

    case "/edition": {

      const slot = data.slot === "pm" ? "pm" : "am";

      if (!data.refresh){ const saved = await dget(key, null); if (saved) return saved; if (!data.current) throw new Error("ไม่มีฉบับนี้ในคลัง"); }
      const feed = await api("/news", { topics: p.topics, period: "1d", length: p.length });
      const out = { ...feed, date, slot, created: new Date().toISOString() };
      await dset(key, out);
      const list = (await dget(P("edlist"), [])).filter(x => x.key !== date + ":" + slot);
      list.unshift({ key: date + ":" + slot, created: out.created, count: out.items.length });
      await dset(P("edlist"), list.slice(0, 30));
      for (const old of list.slice(30)) await ddel(P("ed_" + old.key.replace(":", "_")));

  search: null, follows: [], storyQ: null, story: null, saved: [], vMode: "sum", vResult: null, vHistory: [], vUrl: "", vTitle: "", busy: false,
};
const $ = id => document.getElementById(id);
const L = () => T[(S.prefs && S.prefs.uiLang) || "th"];
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safeUrl(u){ return /^https?:\/\//i.test(String(u||"")) ? esc(u) : "#"; }
function toSec(t){ return String(t||"0").split(":").reduce((a,b)=>a*60+(Number(b)||0),0); }
function ago(d){
  const t = Date.parse(d); if (!t) return String(d || "");
  const m = Math.max(1, Math.round((Date.now()-t)/60000)), th = (S.prefs||{}).uiLang !== "en";
  if (m < 60) return th ? `${m} นาทีที่แล้ว` : `${m}m ago`;
  const h = Math.round(m/60); if (h < 24) return th ? `${h} ชม.ที่แล้ว` : `${h}h ago`;
  const dd = Math.round(h/24); return th ? `${dd} วันที่แล้ว` : `${dd}d ago`;
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1900); }
const svg = (d,s=20,w=2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  home:'<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>', follow:'<path d="M6 4h12v16l-6-4-6 4z"/>',
  video:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>', ext:'<path d="M7 17L17 7M9 7h8v8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
};

/* =================== วันที่และฉบับ =================== */
const pad = n => String(n).padStart(2,"0");
function slotNow(){ return new Date().getHours() < 13 ? "am" : "pm"; }
function dateKey(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function curKey(){ return `${dateKey()}:${slotNow()}`; }
function fmtDate(key){
  const [y,m,d] = key.split("-").map(Number), dt = new Date(y, m-1, d), t = L(), th = t === T.th;
  return th ? `วัน${t.days[dt.getDay()]}ที่ ${d} ${t.months[m-1]} ${y+543}` : `${t.days[dt.getDay()]} ${d} ${t.months[m-1]} ${y}`;
}
function edName(k){ const [d,s] = k.split(":"); return `${L()[s]} · ${fmtDate(d)}`; }

/* =================== API =================== */
async function api(path, data = {}){ return B.call(path, { ...data, user: S.user, _prefs: S.prefs }); }
async function savePrefs(patch){
  Object.assign(S.prefs, patch); applyPrefs(); render();
  try { const d = await api("/prefs/save", { prefs: S.prefs }); if (d && d.prefs){ S.prefs = d.prefs; applyPrefs(); } } catch(e){ toast(e.message); }
}
function applyPrefs(){
  const p = S.prefs || {}, root = document.documentElement;
  if (p.theme === "dark" || p.theme === "light") root.dataset.gn = p.theme; else delete root.dataset.gn;
  root.lang = p.uiLang === "en" ? "en" : "th";
  root.style.setProperty("--fs", ({s:"15px",m:"17px",l:"19px"})[p.fontSize] || "17px");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(root).getPropertyValue("--paper").trim() || "#F3EEE3";
}

/* =================== การอ่าน =================== */
function readMin(n){ const chars = (n.headline||"").length + (n.points||[]).join("").length; return Math.max(1, Math.round(chars / 350)); }
function readsMap(){ try { return JSON.parse(lsGet("gn_reads_" + S.user) || "{}"); } catch(e){ return {}; } }
function markRead(n){ const m = readsMap(); const k = n.link || n.headline; m[k] = (m[k]||0) + 1; lsSet("gn_reads_" + S.user, JSON.stringify(m)); }
function mostRead(items){
  const m = readsMap();
  return [...items].sort((a,b) => ((m[b.link||b.headline]||0) - (m[a.link||a.headline]||0)) || ((b.sources||1) - (a.sources||1))).slice(0, 5);
}

/* =================== ส่วนแสดงผล =================== */
function loading(text){ return `<div class="loading"><div class="spin"></div><div>${esc(text)}</div></div>`; }
function errBox(msg, retryId){ return `<div class="stack" style="padding:30px 0"><div class="err">${esc(msg)}</div>${retryId?`<button class="btn ghost" id="${retryId}">${esc(L().retry)}</button>`:""}</div>`; }
function metaLine(n){
  const t = L(), bits = [];
  if (n.source) bits.push(esc(n.source));
  if (n.date) bits.push(esc(ago(n.date)));
  bits.push(esc(t.readMin(readMin(n))));
  if ((n.sources||1) > 1) bits.push(esc(t.reported(n.sources)));
  return `<div class="meta">${bits.map((b,i)=>`<span class="${i?"dot":""}">${b}</span>`).join("")}</div>`;
}
function imgTag(n, cls="img"){ return (F.images && n.image) ? `<img class="${cls}" src="${safeUrl(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""; }
function storyCard(n, opts = {}){
  const pts = n.points || [];
  return `<button class="story" data-open="${n.id}">
    ${opts.noImg ? "" : imgTag(n)}
    <span class="kicker">${esc(n.category || n.topic)}</span>
    <h3 class="hl">${esc(n.headline)}</h3>
    ${opts.summary !== false && pts.length ? `<p class="clamp2">${esc(pts.join(" "))}</p>` : ""}
    ${metaLine(n)}
  </button>`;
}

function render(){
  const t = L(), v = $("view");
  document.body.classList.toggle("no-mast", !(S.view === "front" || S.view === "section"));
  $("mastWrap").hidden = !(S.view === "front" || S.view === "section");
  $("dateline").textContent = S.edKey ? `${fmtDate(S.edKey.split(":")[0])}  ·  ${t[S.edKey.split(":")[1]]}` : fmtDate(dateKey());
  $("edLabel").textContent = S.edKey ? t[S.edKey.split(":")[1]] : t[slotNow()];
  $("whoLabel").textContent = S.prefs && S.prefs.name ? S.prefs.name : (S.user === "jo" ? t.p1 : t.p2);
  renderSections(); renderTicker(); renderTabs();
  if (!S.ready){ v.innerHTML = S.err ? errBox(S.err, "bootRetry") : loading(""); return; }
  if (S.view === "front") v.innerHTML = frontView();
  else if (S.view === "section") v.innerHTML = sectionView();
  else if (S.view === "article") v.innerHTML = articleView();
  else if (S.view === "search") v.innerHTML = searchView();
  else if (S.view === "follow") v.innerHTML = S.storyQ ? storyView() : followView();
  else if (S.view === "video") v.innerHTML = videoView();
}
function topicsOfEdition(){
  const e = S.edition; if (!e || !e.items) return (S.prefs && S.prefs.topics) || [];
  return [...new Set(e.items.map(i => i.topic))];
}
function renderSections(){
  const t = L();

  const b = (id, label, on, extra="") => `<button class="sec-btn ${on?"on":""} ${extra}" data-nav="${esc(id)}">${esc(label)}</button>`;
  $("secList").innerHTML = b("front", t.home, S.view === "front")
    + secs.map(s => b("sec:" + s, s, S.view === "section" && S.section === s)).join("")
    + b("follow", t.follow, S.view === "follow") + b("video", t.video, S.view === "video")
    + b("customize", "✎ " + t.customize, false, "edit");
}
function renderTicker(){
  const tk = $("ticker"), e = S.edition;

  const top = [...e.items].sort((a,b) => (b.sources||1) - (a.sources||1)).slice(0, 8);

  tk.hidden = false;
  tk.innerHTML = `<div class="wrap"><span class="tk-label">${esc(L().breaking)}</span><div class="tk-track"><div class="tk-run">${run}${run.replace(/data-open/g,'tabindex="-1" aria-hidden="true" data-open')}</div></div></div>`;

    .map(([k,ic,l]) => `<button class="${on(k)?"on":""}" data-nav="${k}">${svg(ic,22)}${esc(l)}</button>`).join("");

/* ---- หน้าแรก ---- */
function frontView(){
  const t = L(), e = S.edition;
  if (S.busy || !e) return loading(t.printing);
  if (e.error) return errBox(e.error, "edRetry");
  const items = e.items; if (!items.length) return `<div class="empty">${esc(t.noEdition)}</div>`;
  const lead = items[0], second = items.slice(1, 4), rest = items.slice(4);
  const noLeadImg = !(F.images && lead.image);
  const mr = mostRead(items);
  const bySec = {};
  rest.forEach(n => (bySec[n.topic] = bySec[n.topic] || []).push(n));
  return `
  ${e.overview ? `<div class="overview"><b>${esc(t.inBrief)}</b><p>${esc(e.overview)}</p></div>` : ""}
  <section class="front">
    <div class="stack" style="gap:22px;min-width:0"><button class="story lead" data-open="${lead.id}">
      ${imgTag(lead)}
      <span class="kicker">${esc(lead.category || lead.topic)}</span>
      <h2 class="hl">${esc(lead.headline)}</h2>
      ${(lead.points||[]).length ? `<p class="standfirst">${esc(lead.points.join(" "))}</p>` : ""}
      ${metaLine(lead)}
    </button>
    ${noLeadImg ? second.map(n => `<hr class="rule" style="margin:0">${storyCard(n)}`).join("") : ""}</div>
    <aside class="aside">
      <div><h3 class="box-h">${esc(t.mostRead)}</h3>
        <ol class="mostread">${mr.map(n => `<li><button class="story" data-open="${n.id}"><span class="hl">${esc(n.headline)}</span>${metaLine(n)}</button></li>`).join("")}</ol></div>
      ${F.recommend ? picksBox() : ""}
    </aside>
  </section>
  ${second.length && !noLeadImg ? `<hr class="rule"><section class="row3">${second.map(n => storyCard(n)).join("")}</section>` : ""}
  ${Object.keys(bySec).length ? `<section class="secgrid">${Object.keys(bySec).map(s => `<div class="seccol"><div class="sec-h"><h2>${esc(s)}</h2><button data-nav="sec:${esc(s)}">${esc(t.more)} ›</button></div>
    ${bySec[s].map((n, i) => i === 0 ? storyCard(n) : storyCard(n, { noImg: true, summary: false }).replace('class="story"', 'class="story small"')).join("")}</div>`).join("")}</section>` : ""}
  <div class="end">${esc(t.endOfPaper)}</div>
  <p class="note" style="text-align:center">${esc(edName(S.edKey))} · ${esc(ago(e.created))}</p>`;
}
function picksBox(){
  const t = L();
  let inner;
  if (!S.rec) inner = `<button class="btn ghost block" id="recBtn">${svg(IC.spark,18)} ${esc(t.picksBtn)}</button>`;
  else if (S.rec.loading) inner = loading("");
  else if (S.rec.error) inner = `<div class="err">${esc(S.rec.error)}</div>`;
  else inner = S.rec.picks.map(p => `<a class="story" href="${safeUrl(p.link)}" target="_blank" rel="noopener">

      <span class="why">${p.outside?`<b style="color:var(--accent)">${esc(t.outside)}</b> · `:""}${esc(t.why)}: ${esc(p.why)}${p.source?" · "+esc(p.source):""}</span></a>`).join("");
  return `<div><h3 class="box-h">${esc(t.picks)}<span class="kicker" style="font-size:11px">AI</span></h3><div class="edbox">${inner}</div></div>`;
}
function sectionView(){
  const t = L(), e = S.edition;
  if (S.busy || !e) return loading(t.printing);
  if (e.error) return errBox(e.error, "edRetry");
  const items = (e.items||[]).filter(n => n.topic === S.section);

  ${rest.length > 3 ? `<hr class="rule"><div class="grid">${rest.slice(3).map(n => storyCard(n)).join("")}</div>` : ""}`;

function currentList(){ return S.from === "search" ? (S.search && S.search.items) || [] : (S.edition && S.edition.items) || []; }
function articleView(){

/* ---- ค้นหา ---- */

/* ---- วิดีโอ ---- */

    res = `<article class="article" style="margin-top:24px">
      ${F.images && byUrl && v.id ? `<a href="${safeUrl(v.url)}" target="_blank" rel="noopener"><img class="img" src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt=""></a>` : ""}
      <span class="kicker">${esc(v.channel || "Video")}${v.category ? " · " + esc(v.category) : ""}</span>
      <h2 class="hl" style="font-size:30px">${esc(v.headline)}</h2>${body}
      <div class="actions"><button class="btn ghost" id="vCopy">${esc(t.copy)}</button></div><p class="note">${esc(t.aiNote)}</p></article>`;
  }
  return `<h1 class="page-h">${esc(t.videoH)}</h1>
  <section class="stack" style="max-width:740px;margin:18px auto 0">
    ${byUrl ? `<label class="label" for="yt">${esc(t.ytLink)}</label><input id="yt" class="field" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off" value="${esc(S.vUrl)}">`
      : `<label class="label" for="vTitle">${esc(t.clipTitle)}</label><input id="vTitle" class="field" placeholder="https://youtu.be/…" value="${esc(S.vTitle)}">
         <label class="label" for="yt">${esc(t.transcript)}</label><textarea id="yt" class="field" placeholder="${esc(t.transcriptPh)}">${esc(S.vUrl)}</textarea>`}
    <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="${S.vMode==="sum"?"on":""}" data-vmode="sum">${esc(t.modeSum)}</button><button class="${S.vMode==="full"?"on":""}" data-vmode="full">${esc(t.modeFull)}</button></div>
    <button class="btn red" id="vGo" ${S.busy?"disabled":""}>${esc(S.vMode==="sum"?t.goSum:t.goFull)}</button>
  </section>
  ${res}
  ${S.vHistory.length ? `<section style="max-width:740px;margin:28px auto 0"><h3 class="box-h">${esc(t.history)}</h3>${S.vHistory.slice(0,12).map((h,i) =>
    `<button class="listrow" data-vh="${i}"><span><span style="font-weight:600">${esc(h.headline||h.id)}</span><br><span class="meta">${esc(h.mode==="full"?t.modeFull:t.modeSum)} · ${esc(ago(h.created))}</span></span><span class="meta">›</span></button>`).join("")}</section>` : ""}`;
}

/* =================== การกระทำ =================== */
async function loadEdition(key, refresh){
  S.edKey = key; S.edition = null; S.busy = true; S.rec = null; render();
  try {
    const [date, slot] = key.split(":");
    S.edition = await api("/edition", { date, slot, refresh: !!refresh, current: key === curKey() });
  } catch(e){ S.edition = { error: e.message }; }
  S.busy = false; render();
  if (S.edition && !S.edition.error) api("/edition/list").then(x => { S.editions = x.editions || []; }).catch(()=>{});
}
async function runSearch(q){
  S.view = "search"; S.search = { q, loading: true }; render(); scrollTo(0,0);
  try { const r = await api("/news", { topics: [q], period: "7d", length: S.prefs.length, search: true }); S.search = { q, ...r }; }
  catch(e){ S.search = { q, error: e.message }; }
  render();
}
async function openStory(q, refresh, add){
  S.view = "follow"; S.storyQ = q; S.story = null; render(); scrollTo(0,0);
  try { S.story = await api("/story", { q, refresh: !!refresh, add }); } catch(e){ S.story = { error: e.message }; }
  if (S.storyQ === q) render();
}
async function runVideo(){
  const inp = $("yt"); S.vUrl = inp ? inp.value.trim() : S.vUrl; S.vTitle = ($("vTitle")||{}).value || S.vTitle;
  if (!S.vUrl) return;
  S.busy = true; S.vErr = null; S.vResult = null; render();
  try {
    S.vResult = await api("/video", F.video === "transcript" ? { text: S.vUrl, title: S.vTitle, mode: S.vMode } : { url: S.vUrl, mode: S.vMode });
    api("/video/history").then(d => { S.vHistory = d.history || []; render(); }).catch(()=>{});
  } catch(e){ S.vErr = e.message; }
  S.busy = false; render();
}
function go(view){
  closeAll();
  if (view === "front"){ S.view = "front"; if (!S.edition || S.edition.error) loadEdition(S.edKey || curKey()); }
  else if (view.startsWith("sec:")){ S.view = "section"; S.section = view.slice(4); }
  else if (view === "follow" || view === "followList"){ S.view = "follow"; S.storyQ = null; S.story = null; }
  else if (view === "video"){ S.view = "video"; if (!S.vHistory.length) api("/video/history").then(d => { S.vHistory = d.history || []; render(); }).catch(()=>{}); }
  else if (view === "customize"){ openSheet("customize"); return; }
  else if (view === "searchTab"){ toggleSearch(true); return; }
  else if (view === "searchBack"){ S.view = "search"; }
  render(); scrollTo(0,0);
}
function toggleSearch(force){
  const r = $("searchRow"), open = force ?? !r.classList.contains("open");
  r.classList.toggle("open", open); if (open){ scrollTo(0,0); setTimeout(() => $("q").focus(), 30); }
}

document.addEventListener("click", async e => {
  const el = e.target.closest("button,a"); if (!el) return;
  const d = el.dataset;
  if (el.id === "logo"){ e.preventDefault(); go("front"); return; }
  if (d.nav){ go(d.nav); return; }
  if (d.open !== undefined){
    const list = S.view === "search" ? (S.search && S.search.items) || [] : (S.edition && S.edition.items) || [];
    const n = list.find(x => String(x.id) === d.open); if (!n) return;
    S.from = S.view === "search" ? "search" : "edition"; S.article = n.id; S.view = "article"; markRead(n); render(); scrollTo(0,0); return;
  }
  if (e.target.dataset && e.target.dataset.del){ e.stopPropagation(); const x = e.target.dataset.del;
    S.draft.customTopics = S.draft.customTopics.filter(c => c !== x); S.draft.topics = S.draft.topics.filter(c => c !== x); openSheet("customize"); return; }
  if (d.topic){ const x = d.topic, on = S.draft.topics.includes(x); S.draft.topics = on ? S.draft.topics.filter(c => c !== x) : [...S.draft.topics, x]; openSheet("customize"); return; }
  if (d.dlen){ S.draft.length = d.dlen; openSheet("customize"); return; }
  if (d.dnc){ S.draft.newsCount = Number(d.dnc); openSheet("customize"); return; }
  if (d.ed){ closeAll(); S.view = "front"; loadEdition(d.ed, false); scrollTo(0,0); return; }
  if (d.vmode){ const inp = $("yt"); if (inp) S.vUrl = inp.value; S.vMode = d.vmode; render(); return; }
  if (d.story){ openStory(d.story); return; }
  if (d.vh !== undefined){ S.vResult = S.vHistory[Number(d.vh)]; S.vErr = null; render(); scrollTo(0,0); return; }
  if (d.save !== undefined){ const n = currentList().find(x => String(x.id) === d.save);
    try { S.saved = (await api("/saved/toggle", { item: n })).saved; render(); toast(L().savedT); } catch(err){ toast(err.message); } return; }
  if (d.follow !== undefined){ const n = currentList().find(x => String(x.id) === d.follow); promptFollow(n.headline.slice(0, 40), [n.headline, ...(n.points||[]), n.source, n.link].filter(Boolean).join("\n")); return; }
  if (d.menu){ closeAll(); openSheet(d.menu); return; }
  if (d.theme){ savePrefs({ theme: d.theme }); openSheet("theme"); return; }
  if (d.uil){ savePrefs({ uiLang: d.uil }); openSheet("lang"); return; }
  if (d.suml){ savePrefs({ sumLang: d.suml }); openSheet("lang"); return; }
  if (d.fs){ savePrefs({ fontSize: d.fs }); openSheet("settings"); return; }
  if (d.preset){ const ta = $("promptTa"); if (ta) ta.value = d.preset; return; }
  if (d.ptab){ S.ptab = d.ptab; openSheet("prompt"); return; }

  switch (el.id){
    case "menuBtn": case "whoBtn": openDrawer(); break;
    case "searchBtn": toggleSearch(); break;
    case "tbMark": go("front"); break;
    case "edBtn": openSheet("editions"); break;
    case "edRetry": loadEdition(S.edKey || curKey(), true); break;
    case "reprint": closeAll(); S.view = "front"; loadEdition(curKey(), true); break;
    case "bootRetry": boot(); break;
    case "searchRetry": runSearch(S.search.q); break;
    case "recBtn": S.rec = { loading: true }; render();
      try { S.rec = await api("/recommend"); } catch(err){ S.rec = { error: err.message }; } render(); break;
    case "addTopic": askText(L().newTopic, v => { if (!S.draft.customTopics.includes(v)){ S.draft.customTopics.push(v); S.draft.topics.push(v); } openSheet("customize"); }); break;
    case "saveCustom": { const dft = S.draft; closeAll(); await savePrefs({ topics: dft.topics, customTopics: dft.customTopics, length: dft.length, newsCount: dft.newsCount }); S.view = "front"; loadEdition(curKey(), true); break; }
    case "addFollow": promptFollow(""); break;
    case "storyRefresh": openStory(S.storyQ, true); break;
    case "storyRetry": openStory(S.storyQ); break;
    case "storyAdd": { const v = ($("storyText")||{}).value || ""; if (v.trim()) openStory(S.storyQ, false, v.trim()); break; }
    case "unfollowBtn": try { S.follows = (await api("/follow/remove", { q: S.storyQ })).follows; } catch(err){ toast(err.message); }
      S.storyQ = null; S.story = null; render(); break;
    case "vGo": runVideo(); break;
    case "vCopy": { const v = S.vResult; const txt = v.mode === "full"
        ? (v.sections||[]).map(s => `[${s.start}] ${s.title}\n` + (s.lines||[]).map(l => `${l.speaker}: ${l.text}`).join("\n")).join("\n\n")
        : `${v.headline}\n\n` + (v.summary||[]).map(s => "• " + s).join("\n") + "\n\n" + (v.key_moments||[]).map(k => `${k.time} ${k.point}`).join("\n");
      try { await navigator.clipboard.writeText(txt); toast(L().copied); } catch(err){ toast("copy failed"); } break; }
    case "switchUser": S.user = S.user === "jo" ? "u2" : "jo"; lsSet("gn_user", S.user); closeAll();
      Object.assign(S, { ready: false, edition: null, edKey: null, rec: null, vResult: null, vHistory: [], follows: [], saved: [], storyQ: null, story: null, view: "front", search: null, err: null });
      boot(); break;
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "searchForm"){ const q = $("q").value.trim(); if (q){ toggleSearch(false); runSearch(q); } return; }
  if (e.target.id !== "askForm") return;
  const inp = $("askIn"), q = inp.value.trim(); if (!q) return;
  inp.value = ""; const box = $("answer");
  box.innerHTML = `<div class="pullbox"><b>${esc(q)}</b>${loading("")}</div>`;
  try { const a = await api("/story/ask", { q: S.storyQ, question: q });
    box.innerHTML = `<div class="pullbox"><b>${esc(q)}</b><p style="margin:6px 0 0;white-space:pre-line">${esc(a.answer)}</p></div>`; }
  catch(err){ box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
});
document.addEventListener("input", e => { if (e.target.id === "yt") S.vUrl = e.target.value; if (e.target.id === "vTitle") S.vTitle = e.target.value; });
addEventListener("scroll", () => document.body.classList.toggle("scrolled", scrollY > 150), { passive: true });

function promptFollow(def, seed){
  askText(L().newFollow, async v => {
    try { S.follows = (await api("/follow/add", { q: v, seed })).follows; toast(L().followed); openStory(v); }
    catch(err){ toast(err.message); }
  }, def);
}

/* =================== เมนู + แผ่น =================== */
function openDrawer(){
  const t = L(), p = S.prefs || {};
  const item = (k, title, sub) => `<button class="mi" data-menu="${k}"><span>${esc(title)}<small>${esc(sub)}</small></span></button>`;
  $("drawer").innerHTML = `
    <div class="hd"><b>${esc(t.menu)}</b><button class="icon-btn" data-close="1" aria-label="close">${svg(IC.close,22)}</button></div>
    <div class="who"><span class="avatar">${esc((p.name||"G").slice(0,1).toUpperCase())}</span>
      <div style="flex:1"><b>${esc(p.name||"—")}</b><div class="meta">${S.user==="jo"?t.p1:t.p2}</div></div>
      <button class="chip" id="switchUser">${esc(t.switchTo)} ${S.user==="jo"?"2":"1"}</button></div>
    <button class="mi" data-nav="front"><span>${esc(t.home)}</span></button>
    <button class="mi" data-nav="follow"><span>${esc(t.follow)}<small>${S.follows.length}</small></span></button>
    <button class="mi" data-nav="video"><span>${esc(t.videoH)}</span></button>
    ${item("editions", t.backIssues, t.am + " / " + t.pm)}
    ${item("customize", t.customize, (p.topics||[]).join(", "))}
    ${item("saved", t.savedNews, String(S.saved.length))}
    ${item("profile", t.profile, p.name || "")}
    ${item("prompt", t.prompt, "")}
    ${item("theme", t.theme, t[p.theme] || "")}
    ${item("lang", t.lang, `${p.uiLang==="en"?"English":"ไทย"} · ${p.sumLang==="en"?"English":"ไทย"}`)}
    ${item("settings", t.settings, "")}
    ${F.quota ? `<div class="mi" id="quotaBox" style="border:0"><span class="meta">${esc(t.quota)}: …</span></div>` : ""}`;
  $("drawerWrap").classList.add("open");
  if (F.quota) api("/quota").then(q => { const b = $("quotaBox"); if (b) b.innerHTML = `<span class="meta">${esc(t.quota)}: <b>${q.aiCalls} / ${q.limit}</b></span>`; }).catch(()=>{});
}
function closeAll(){ $("drawerWrap").classList.remove("open"); $("sheetWrap").classList.remove("open"); }
["drawerWrap","sheetWrap"].forEach(id => $(id).addEventListener("click", e => { if (e.target.id === id || e.target.closest("[data-close]")){ closeAll(); render(); } }));
addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });

function sheetShell(title, body){
  $("sheet").innerHTML = `<div class="hd"><b>${esc(title)}</b><button class="icon-btn" data-close="1" aria-label="close">${svg(IC.close,22)}</button></div><div class="bd">${body}</div>`;
  $("sheetWrap").classList.add("open");
}
function segRow(attr, cur, opts){
  return `<div class="seg" style="grid-template-columns:repeat(${opts.length},minmax(0,1fr))">${opts.map(([v,l]) => `<button class="${String(cur)===String(v)?"on":""}" data-${attr}="${v}">${esc(l)}</button>`).join("")}</div>`;
}
function openSheet(kind){
  const t = L(), p = S.prefs;
  if (kind === "customize"){
    if (!S.draft || !$("sheetWrap").classList.contains("open")) S.draft = JSON.parse(JSON.stringify({ topics: p.topics, customTopics: p.customTopics, length: p.length, newsCount: p.newsCount }));
    const dft = S.draft, all = [...BASE_TOPICS, ...dft.customTopics];
    sheetShell(t.customize, `<span class="label">${esc(t.topics)}</span>
      <div class="chips">${all.map(x => { const on = dft.topics.includes(x), c = dft.customTopics.includes(x);
        return `<button class="chip ${on?"on":""}" data-topic="${esc(x)}" aria-pressed="${on}">${esc(x)}${c?` <span class="x" data-del="${esc(x)}">×</span>`:""}</button>`; }).join("")}
        <button class="chip dash" id="addTopic">${esc(t.add)}</button></div>
      <span class="label">${esc(t.len)}</span>${segRow("dlen", dft.length, [["short",t.short],["mid",t.mid],["long",t.long]])}
      <span class="label">${esc(t.count)}</span>${segRow("dnc", dft.newsCount, [[10,"10"],[20,"20"],[30,"30"]])}
      <button class="btn red block" id="saveCustom" ${dft.topics.length?"":"disabled"}>${esc(t.saveReprint)}</button>`);
  }
  if (kind === "editions"){
    const keys = []; const now = new Date();
    for (let i = 0; i < 7; i++){ const d = new Date(now); d.setDate(d.getDate() - i); const k = dateKey(d);
      ["pm","am"].forEach(s => { const key = `${k}:${s}`; if (i === 0 && s === "pm" && slotNow() === "am") return; keys.push(key); }); }
    const have = new Set((S.editions||[]).map(x => x.key));
    sheetShell(t.backIssues, keys.map(k => { const cur = k === curKey(), ok = cur || have.has(k);
      return `<button class="listrow" data-ed="${k}" ${ok?"":"disabled style=\"opacity:.45\""}><span><span style="font-weight:${k===S.edKey?800:600}">${esc(edName(k))}</span>${cur?`<br><span class="kicker">${esc(t.current)}</span>`:""}</span><span class="meta">${k===S.edKey?"●":"›"}</span></button>`; }).join("")
      + `<button class="btn ghost" id="reprint">${svg(IC.refresh,16)} ${esc(t.reprint)}</button>`);
  }
  if (kind === "profile"){
    sheetShell(t.profile, `<label class="label" for="nm">${esc(t.name)}</label><input id="nm" class="field" value="${esc(p.name)}" maxlength="40"><button class="btn" id="saveProfile">${esc(t.saveBtn)}</button>`);
    $("saveProfile").onclick = () => { savePrefs({ name: $("nm").value.trim() }); closeAll(); toast(t.savedT); };
  }
  if (kind === "theme") sheetShell(t.theme, segRow("theme", p.theme, [["light",t.light],["dark",t.dark],["auto",t.auto]]));
  if (kind === "lang") sheetShell(t.lang, `<span class="label">${esc(t.uiLang)}</span>${segRow("uil", p.uiLang, [["th","ไทย"],["en","English"]])}<span class="label">${esc(t.sumLang)}</span>${segRow("suml", p.sumLang, [["th","ไทย"],["en","English"]])}`);
  if (kind === "settings") sheetShell(t.settings, `<span class="label">${esc(t.font)}</span>${segRow("fs", p.fontSize, [["s","A"],["m","A+"],["l","A++"]])}`);
  if (kind === "saved") sheetShell(t.savedNews, S.saved.length ? S.saved.map(s => `<a class="listrow" href="${safeUrl(s.link)}" target="_blank" rel="noopener"><span><span style="font-weight:600">${esc(s.headline)}</span><br><span class="meta">${esc(s.source||"")} · ${esc(ago(s.saved))}</span></span><span class="meta">↗</span></a>`).join("") : `<div class="empty">${esc(t.noSaved)}</div>`);
  if (kind === "prompt"){
    const k = S.ptab || "news";
    const names = { news: t.pNews, ...(F.recommend ? { recommend: t.pRec } : {}), story: t.pStory, video: t.pVideo };
    sheetShell(t.prompt, `<div class="chips">${Object.keys(names).map(x => `<button class="chip ${x===k?"on":""}" data-ptab="${x}">${esc(names[x])}</button>`).join("")}</div>
      <p class="meta" style="margin:0">${esc(t.promptHelp)}</p><label class="sr" for="promptTa">${esc(names[k])}</label>
      <textarea id="promptTa" class="field" maxlength="1500">${esc(p.styles[k]||"")}</textarea>
      <div class="chips">${t.presets.map(x => `<button class="chip" data-preset="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="resetPrompt">${esc(t.reset)}</button><button class="btn" id="savePrompt">${esc(t.saveBtn)}</button></div>`);
    $("savePrompt").onclick = () => { savePrefs({ styles: { ...p.styles, [k]: $("promptTa").value.trim() } }); toast(t.savedT); };
    $("resetPrompt").onclick = () => { $("promptTa").value = ""; savePrefs({ styles: { ...p.styles, [k]: "" } }); toast(t.savedT); };
  }
}
function askText(label, cb, def){
  const t = L();
  sheetShell(label, `<label class="sr" for="askT">${esc(label)}</label><input id="askT" class="field" maxlength="60" value="${esc(def||"")}" placeholder="${esc(label)}">
    <div class="actions"><button class="btn ghost" data-close="1">${esc(t.cancel)}</button><button class="btn" id="askOk">${esc(t.ok)}</button></div>`);
  const inp = $("askT"); setTimeout(() => inp.focus(), 50);
  const ok = () => { const v = inp.value.trim(); if (!v) return; $("sheetWrap").classList.remove("open"); cb(v); render(); };
  $("askOk").onclick = ok; inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); ok(); } };
}

/* =================== เริ่มต้น =================== */
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyPrefs);
async function boot(){
  S.ready = false; S.err = null; render();
  try {
    const d = await api("/login");
    S.prefs = d.prefs; S.ready = true; applyPrefs();
    api("/follow/list").then(x => { S.follows = x.follows || []; }).catch(()=>{});
    api("/saved/list").then(x => { S.saved = x.saved || []; }).catch(()=>{});
    loadEdition(curKey(), false);
  } catch(e){ S.err = e.message; render(); }
}
boot();
</script>
