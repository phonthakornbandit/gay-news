name = "gay-news"
main = "src/index.js"
compatibility_date = "2025-09-01"

# ให้ Worker รันในสหรัฐฯ เสมอ (Gemini API ไม่รองรับบางประเทศ เช่น ฮ่องกง ที่ Cloudflare อาจส่งคำขอผ่าน)
[placement]
region = "aws:us-east-1"

# KV namespace "NEWS"
[[kv_namespaces]]
binding = "NEWS"
id = "ac983757884a4bf5b518cce174ad22b1"

# Secrets (ตั้งใน Cloudflare เท่านั้น ห้ามใส่ในไฟล์นี้):
#   GEMINI_API_KEY  (ไม่บังคับ: DAILY_LIMIT)
